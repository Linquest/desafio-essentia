name: essentia-magento-local

services:
  php:
    build: .
    volumes:
      - magento_data:/var/www/html
      - ../Essentia/StorePickup:/module-source:ro
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  web:
    image: nginx:1.30
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - magento_data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: magento_root_local
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: magento_local
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - search_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  magento_data:
  database_data:
  search_data:
